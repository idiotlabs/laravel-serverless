service: idiotlabs-laravel

provider:
    name: aws
    # The AWS region in which to deploy (us-east-1 is the default)
    region: ap-northeast-2
    profile: idiotlabs-serverless
    # Environment variables
    environment:
        APP_ENV: production # Or use ${sls:stage} if you want the environment to match the stage

package:
    # Files and directories to exclude from deployment
    patterns:
        - '!node_modules/**'
        - '!public/storage'
        - '!resources/assets/**'
        - '!storage/**'
        - '!tests/**'
        - '!vendor/fakerphp/**'
        - '!vendor/phpunit/**'
        - '!vendor/mockery/**'
        - '!vendor/nunomaduro/collision/**'
        - '!vendor/spatie/laravel-ignition/**'
        - '!vendor/spatie/ignition/**'
        - '!vendor/spatie/flare-client-php/**'
        - '!vendor/spatie/backtrace/**'
        - '!vendor/spatie/error-solutions/**'
        - '!vendor/barryvdh/laravel-ide-helper/**'
        - '!vendor/laravel/sail/**'
        - '!vendor/laravel/pint/**'
        - '!vendor/sebastian/**'
        - '!vendor/phar-io/**'
        - '!vendor/myclabs/**'
        - '!vendor/theseer/**'
        - '!vendor/**/*.md'
        - '!vendor/**/*.txt'
        - '!vendor/**/{test,tests,Test,Tests,doc,docs,example,examples,fixture,fixtures}/**'

functions:

    # This function runs the Laravel website/API
    web:
        handler: public/index.php
        runtime: php-85-fpm
        architecture: arm64
        timeout: 28 # in seconds (API Gateway has a timeout of 29 seconds)
        events:
            - httpApi: '*'

    # This function lets us run artisan commands in Lambda
    artisan:
        handler: artisan
        runtime: php-85-console
        timeout: 720 # in seconds
        # Uncomment to also run the scheduler every minute
        events:
          - schedule:
              rate: rate(1 minute)
              input: '"schedule:run"'


plugins:
    # We need to include the Bref plugin
    - ./vendor/bref/bref
